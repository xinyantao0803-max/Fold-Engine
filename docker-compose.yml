# Fold Mod — one-command FH deployment.
#
# network_mode: "host" is mandatory: it avoids an extra UDP/NAT hop and lets the
# SCP:SL server on the same host reach FH at ws://127.0.0.1:9000/ws.
#
# Start:
#   docker compose up -d --build
#
# Logs:
#   docker compose logs -f foldedge

services:
  foldedge:
    build:
      context: .
      dockerfile: FoldEdge/Dockerfile
    image: ghcr.io/xinyantao0803-max/fold-engine:v1.4.0
    container_name: foldedge
    network_mode: "host"
    restart: always
    volumes:
      - ./FoldEdge/keys:/app/keys
      - ./FoldEdge/Modules:/app/Modules
      - ./FoldEdge/Assets:/app/Assets
      - ./FoldEdge/Media:/app/Media
      - ./FoldEdge/Data:/app/Data
    environment:
      # 0.0.0.0 is required inside the container; use a firewall/VPN if the
      # dashboard must not be reachable from the LAN.
      - ListenUrl=http://0.0.0.0:9000
      - VpnServer=vpn.example.com
      - VpnTunnelType=L2tp
      # The Linux container cannot launch the Windows SCP:SL server.
      - GameServer__AutoStart=false
      # Set a gateway token before exposing /api/vpn/verify beyond localhost:
      # - VpnGatewayToken=change-me-before-exposing
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production

  # ---------------------------------------------------------------------------
  # SCP:SL game server
  #
  # A reliable game-server image depends on the server distribution and LabAPI
  # version you use, so this repository does not ship a fake/untested image.
  # Add your existing SCP:SL server service here, keep network_mode: "host",
  # and point FoldEngine's FoldEdgeUrl to ws://127.0.0.1:9000/ws.
  #
  #  scpsl:
  #    image: ${SCPSL_IMAGE}
  #    container_name: scpsl
  #    network_mode: "host"
  #    restart: always
  #    volumes:
  #      - ./scpsl:/scpsl
  # ---------------------------------------------------------------------------
